<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400">
        <defs>
          <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe7f3"/><stop offset="1" stop-color="#f4f6f8"/></linearGradient>
          <pattern id="plyE" width="6" height="12" patternUnits="userSpaceOnUse"><rect width="6" height="3" fill="#e9d3a8"/><rect y="3" width="6" height="3" fill="#a67c3f"/><rect y="6" width="6" height="3" fill="#c9a56b"/><rect y="9" width="6" height="3" fill="#6b4c22"/></pattern>
        </defs>
        <rect width="500" height="400" rx="8" fill="url(#gSky)"/>
        <!-- distant hills (Western Ghats) -->
        <path d="M0 250 Q60 200 120 235 T240 225 T360 240 T500 220 V400 H0Z" fill="#b9cbbf" opacity=".55"/>
        <path d="M0 275 Q80 240 160 265 T320 262 T500 268 V400 H0Z" fill="#9db9a6" opacity=".55"/>
        <!-- rubber trees -->
        <g stroke="#4c6b4a" stroke-width="3"><line x1="40" y1="300" x2="40" y2="262"/><line x1="62" y1="300" x2="62" y2="258"/><line x1="84" y1="300" x2="84" y2="264"/><line x1="440" y1="300" x2="440" y2="262"/><line x1="462" y1="300" x2="462" y2="258"/></g>
        <g fill="#5f8a5a"><ellipse cx="40" cy="258" rx="14" ry="10"/><ellipse cx="62" cy="252" rx="15" ry="11"/><ellipse cx="84" cy="259" rx="13" ry="10"/><ellipse cx="440" cy="258" rx="14" ry="10"/><ellipse cx="462" cy="252" rx="15" ry="11"/></g>
        <!-- ground / road -->
        <rect x="0" y="300" width="500" height="100" fill="#cfd8e2"/>
        <rect x="0" y="330" width="500" height="34" fill="#2b3b52"/>
        <g stroke="#f4f6f8" stroke-width="3" stroke-dasharray="22 16"><line x1="0" y1="347" x2="500" y2="347"/></g>
        <!-- mill shed -->
        <path d="M20 300 V222 L120 190 L220 222 V300Z" fill="#e1e7ee" stroke="#16273f" stroke-width="2"/>
        <path d="M20 222 L120 190 L220 222" fill="none" stroke="#16273f" stroke-width="2"/>
        <rect x="35" y="240" width="60" height="60" fill="#16273f"/>
        <rect x="140" y="236" width="56" height="22" fill="#b8862b"/>
        <text x="168" y="252" text-anchor="middle" font-family="Archivo,sans-serif" font-size="12" font-weight="700" fill="#fff">ISI</text>
        <!-- plywood bundles stacked -->
        <g transform="translate(236 230)">
          <rect x="0" y="48" width="96" height="22" fill="url(#plyE)" stroke="#6b4c22" stroke-width="1"/>
          <rect x="0" y="24" width="96" height="22" fill="url(#plyE)" stroke="#6b4c22" stroke-width="1"/>
          <rect x="0" y="0" width="96" height="22" fill="url(#plyE)" stroke="#6b4c22" stroke-width="1"/>
          <g stroke="#16273f" stroke-width="3"><line x1="22" y1="-2" x2="22" y2="72"/><line x1="74" y1="-2" x2="74" y2="72"/></g>
        </g>
        <!-- truck -->
        <g transform="translate(300 262)">
          <rect x="0" y="0" width="150" height="54" rx="3" fill="#f4f6f8" stroke="#16273f" stroke-width="2.5"/>
          <rect x="10" y="8" width="130" height="38" fill="url(#plyE)" opacity=".9"/>
          <rect x="150" y="18" width="42" height="36" rx="4" fill="#b8862b" stroke="#16273f" stroke-width="2.5"/>
          <rect x="158" y="24" width="22" height="14" rx="2" fill="#dbe7f3"/>
          <rect x="-4" y="54" width="200" height="8" fill="#16273f"/>
          <g fill="#16273f" stroke="#f4f6f8" stroke-width="3"><circle cx="24" cy="66" r="12"/><circle cx="52" cy="66" r="12"/><circle cx="172" cy="66" r="12"/></g>
          <text x="75" y="31" text-anchor="middle" font-family="Archivo,sans-serif" font-size="13" font-weight="800" fill="#16273f" letter-spacing="1">NEXAPLY</text>
        </g>
        <!-- route arc to destinations -->
        <path d="M380 262 C 400 150, 470 120, 492 60" fill="none" stroke="#b8862b" stroke-width="3" stroke-dasharray="7 7"/>
        <g font-family="Archivo,sans-serif" font-size="12" font-weight="600" fill="#16273f">
          <circle cx="492" cy="60" r="5" fill="#b8862b"/><text x="486" y="48" text-anchor="end">Bengaluru · Hyderabad · Pune</text>
          <circle cx="455" cy="128" r="5" fill="#b8862b"/><text x="447" y="124" text-anchor="end">Coimbatore · Chennai</text>
        </g>
        <!-- caption -->
        <text x="18" y="384" font-family="Archivo,sans-serif" font-size="12" font-weight="600" fill="#2b3b52">Loaded at the mill · paid before dispatch · papers sent ahead</text>
      </svg>